vulnerabilityAlerts: true
automatedSecurityFixes: true
secretScanning: true
secretScanningPushProtection: true
privateVulnerabilityReporting: true
dependabotSecurityUpdates: true

rulesets:
  - name: repomanager-default-branch
    target: branch
    enforcement: active
    bypass_actors:
      # Repository admins can always bypass. Without this, an admin (or the
      # bot itself) cannot push hotfixes when the ruleset rolls out, because
      # there's no second approver available in single-maintainer repos.
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: pull_request
        parameters:
          # Every parameter below must be present. They look moot at 0 required
          # reviews, but GitHub's create-ruleset endpoint rejects a partial
          # `pull_request` rule outright ("Invalid property /rules/3: data
          # matches no possible input"). Dropping them only broke *new* repos —
          # rulesets created earlier still carry the full set and our subset
          # comparison kept matching them, so the breakage stayed invisible
          # until a repo needed the ruleset created from scratch.
          #
          # 0 — PRs are still required, but a single maintainer can self-merge
          # without waiting for an approval.
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
          # `merge` stays listed to match the rulesets already deployed across
          # the fleet, so this fix doesn't propose an update on every repo. The
          # repo-level `allow_merge_commit: false` is what actually blocks it.
          allowed_merge_methods:
            - merge
            - squash
            - rebase
