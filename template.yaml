AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: repomanager - GitHub App powered by AWS Lambda

Parameters:
  AppId:
    Type: String
  GitHubWebhookSecret:
    Type: String
    NoEcho: true
  Cert:
    Type: String
    NoEcho: true
  ReadOnly:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Kill switch — when 'true' the bot plans and logs but performs no GitHub writes.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 360
    Architectures:
      - arm64
    Environment:
      Variables:
        APP_ID: !Ref AppId
        GITHUB_WEBHOOK_SECRET: !Ref GitHubWebhookSecret
        CERT: !Ref Cert
        READ_ONLY: !Ref ReadOnly
        NODE_OPTIONS: --enable-source-maps

Resources:
  CronFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: repomanager-cron
      Handler: handler.cronDispatcher
      Timeout: 60
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref CronWorkerFunction
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref CronWorkerFunction
      Events:
        Schedule:
          Type: Schedule
          Properties:
            # Webhooks apply config changes in real time on push; this cron is
            # only a safety-net reconcile for drift that arrives without a
            # webhook (e.g. settings changed in the GitHub UI). Hourly keeps the
            # fleet converged while keeping cron/worker compute ~6x lower than
            # the old 10-minute tick.
            Schedule: rate(1 hour)
      LoggingConfig:
        LogGroup: !Ref CronLogGroup

  CronLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/repomanager-cron
      RetentionInDays: 3

  CronWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: repomanager-cron-worker
      Handler: handler.cronWorker
      # A wedged tenant (e.g. an org too large to finish, or one stuck on a
      # GitHub rate-limit backoff) used to burn the inherited 360s budget and,
      # because async invokes default to 2 retries, was billed 3x (≈1080s) on
      # every tick. 240s bounds the wedge and MaximumRetryAttempts:0 removes the
      # amplification — a cron worker has no value being retried, the next tick
      # is the retry. This pair is the single biggest cost lever.
      Timeout: 240
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 540
      Environment:
        Variables:
          # Process repos within an installation concurrently so a large tenant
          # finishes inside the timeout instead of starving its tail every tick.
          WORKER_CONCURRENCY: '6'
      LoggingConfig:
        LogGroup: !Ref CronWorkerLogGroup

  CronWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/repomanager-cron-worker
      RetentionInDays: 3

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: repomanager-webhook
      Handler: handler.webhook
      Timeout: 30
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: POST
      LoggingConfig:
        LogGroup: !Ref WebhookLogGroup

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/repomanager-webhook
      RetentionInDays: 3

Outputs:
  WebhookUrl:
    Description: Webhook URL to configure in the GitHub App
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook'
